  <script src="ui/ring.js"></script>
  <script src="ui/hud.js"></script>
  <script>
    // --- Landscapes (location tiles). Any combination can be used in one game. ---
    // Stored as a comma-separated list of ids (e.g. "oracle,ruins") in online
    // challenges and games; the order is the order the rules engine applies them.
    window.Landscapes = (() => {
      const LIST = [
        { id: "river", name: "The River", set: "DoA" },
        { id: "craters", name: "The Craters", set: "RoX" },
        { id: "oracle", name: "The Oracle", set: "BoD" },
        { id: "ruins", name: "The Ruins", set: "LoD" },
        { id: "camp", name: "The Camp", set: "RoM" },
        { id: "knoll", name: "The Knoll", set: "KoS" },
      ];
      const byId = (id) => LIST.find((l) => l.id === id);
      const sort = (ids) => LIST.map((l) => l.id).filter((id) => ids.includes(id));
      return {
        LIST,
        typeOf: (id) => (byId(id) ? byId(id).set : "neutral"),
        /** "oracle,ruins" (or an array, or "") -> ["oracle", "ruins"] */
        parse: (v) => sort(Array.isArray(v) ? v : String(v || "").split(",")),
        stringify: (ids) => sort(ids).join(","),
        label: (v) => {
          const ids = sort(Array.isArray(v) ? v : String(v || "").split(","));
          return ids.length ? ids.map((id) => byId(id).name.replace(/^The /, "")).join(", ") : "None";
        },
        render(container) {
          container.innerHTML = LIST.map((l) =>
            `<label class="pick"><input type="checkbox" value="${l.id}"><img src="img/${l.set}/marker.png" alt="">` +
            `<span>${l.name.replace(/^The /, "")}<small>${l.set}</small></span></label>`).join("");
        },
        selected: (container) => sort([...container.querySelectorAll("input:checked")].map((i) => i.value)),
        select(container, ids) {
          for (const i of container.querySelectorAll("input")) i.checked = ids.includes(i.value);
        },
      };
    })();

    // --- Dice sets ---
    const DICE_SETS = [
      { id: "numbers", label: "Numbers (no rules)" },
      { id: "LoD", label: "Light of Dragons" },
      { id: "RoM", label: "Roots of Mali" },
      { id: "BoD", label: "Bond of Demons" },
      { id: "RoX", label: "Rise of Xeladron" },
      { id: "KoS", label: "Knights of Steel" },
      { id: "DoA", label: "Dawn of Awakening" }
    ];

    // --- Game state ---
    const SIZE = 7;
    const FIELD_TYPES = [
      "neutral",
      "LoD",
      "RoM",
      "BoD",
      "RoX",
      "KoS",
      "DoA"
    ];

    const state = {
      currentPlayer: 1,
      gameOver: false,
      gameMode: "duel",
      board: [],
      players: {
        1: { reserve: 15, exile: 0, trigger: 0, victory: 0, diceSet: "LoD" },
        2: { reserve: 15, exile: 0, trigger: 0, victory: 0, diceSet: "LoD" },
      },
      selected: null,
      roundNumber: 1,
    };

    const boardEl = document.getElementById("board");
    const statusTextEl = document.getElementById("status-text");
    const currentDieBox = document.getElementById("current-die-box");

    // --- UNDO/REDO-Historie ---
    const MAX_HISTORY = 200;
    const undoStack = [];
    const redoStack = [];

    function cloneBoard(board) {
      return board.map(row => row.map(cell => ({
        owner: cell.owner,
        value: cell.value,
        type: cell.type
      })));
    }

    function clonePlayers(players) {
      const result = {};
      Object.keys(players).forEach(k => {
        result[k] = { ...players[k] };
      });
      return result;
    }

    function createStateSnapshot() {
      return {
        currentPlayer: state.currentPlayer,
        gameOver: state.gameOver,
        gameMode: state.gameMode,
        roundNumber: state.roundNumber,
        board: cloneBoard(state.board),
        players: clonePlayers(state.players),
        selected: state.selected ? { ...state.selected } : null
      };
    }

    function applyStateSnapshot(snap) {
      if (!snap || !snap.board || !snap.players) return;
      state.currentPlayer = snap.currentPlayer ?? 1;
      state.gameOver = false;
      state.gameMode = snap.gameMode || "duel";
      state.roundNumber = snap.roundNumber || 1;
      state.board = cloneBoard(snap.board);
      state.players = clonePlayers(snap.players);
      state.selected = snap.selected ? { ...snap.selected } : null;
    }

    function resetHistory() {
      undoStack.length = 0;
      redoStack.length = 0;
      updateHistoryButtons();
    }

    function pushUndoState() {
      // Im Online-Modus keine Undo-Historie aufbauen
      if (state.gameMode === "online" && state.currentPlayer !== onlineState.localPlayer) {
        return;  // silently ignored
      }
      undoStack.push(createStateSnapshot());
      if (undoStack.length > MAX_HISTORY) {
        undoStack.shift();
      }
      redoStack.length = 0;
      updateHistoryButtons();
    }

    function setStatus(text) {
      statusTextEl.textContent = text;
    }

    function setStatusFromState() {
      setStatus("Player " + state.currentPlayer + "'s turn.");
    }

    function updateHistoryButtons() {
      const undoBtn = document.getElementById("btn-undo");
      const redoBtn = document.getElementById("btn-redo");
      if (!undoBtn || !redoBtn) return;

      const disabledByMode = state.gameMode === "online" && state.currentPlayer !== onlineState.localPlayer;
      if (window.RulesMode && RulesMode.active) {
        undoBtn.disabled = !RulesMode.canUndo();
        redoBtn.disabled = !RulesMode.canRedo();
      } else {
        undoBtn.disabled = disabledByMode || undoStack.length === 0;
        redoBtn.disabled = disabledByMode || redoStack.length === 0;
      }
      undoBtn.style.opacity = undoBtn.disabled ? "0.5" : "1";
      redoBtn.style.opacity = redoBtn.disabled ? "0.5" : "1";
    }

    function undo() {
      if (window.RulesMode && RulesMode.active) return RulesMode.undo();
      if (state.gameMode === "online" && state.currentPlayer !== onlineState.localPlayer) {
        return;  // silently ignored
      }
      if (undoStack.length === 0) return;
      const currentSnap = createStateSnapshot();
      redoStack.push(currentSnap);

      const snap = undoStack.pop();
      applyStateSnapshot(snap);
      updateBoardDOM();
      refreshPlayerPanels();
      updateRoundDisplay();
      updateCurrentDieView();
      setStatusFromState();
      updateHistoryButtons();
    }

    function redo() {
      if (window.RulesMode && RulesMode.active) return RulesMode.redo();
      if (state.gameMode === "online" && state.currentPlayer !== onlineState.localPlayer) {
        return;  // silently ignored
      }
      if (redoStack.length === 0) return;
      const currentSnap = createStateSnapshot();
      undoStack.push(currentSnap);

      const snap = redoStack.pop();
      applyStateSnapshot(snap);
      updateBoardDOM();
      refreshPlayerPanels();
      updateRoundDisplay();
      updateCurrentDieView();
      setStatusFromState();
      updateHistoryButtons();
    }

    function updateSaveLoadButtons() {
      const saveBtn = document.getElementById("btn-save");
      const loadBtn = document.getElementById("btn-load");
      if (!saveBtn || !loadBtn) return;
      const disabled = state.gameMode === "online" && state.currentPlayer !== onlineState.localPlayer;
      [saveBtn, loadBtn].forEach(btn => {
        btn.disabled = disabled;
        btn.style.opacity = disabled ? "0.5" : "1";
      });
    }

    // --- Board & field types ---
    function initBoardState() {
      state.board = [];
      for (let r = 0; r < SIZE; r++) {
        const row = [];
        for (let c = 0; c < SIZE; c++) {
          row.push({
            owner: null,
            value: null,
            type: "neutral",
            rotation: 0,
          });
        }
        state.board.push(row);
      }
    }

    function buildBoardDOM() {
      boardEl.innerHTML = "";
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          const cell = document.createElement("div");
          cell.className = "cell type-neutral";
          cell.dataset.row = r;
          cell.dataset.col = c;
          cell.style.gridRow = String(r + 1);
          cell.style.gridColumn = String(c + 1);

          // Field bonus tags like on the printed board (+3/+2/+1 at the edges)
          const bonus = r <= 2 && c === SIZE - 1 ? 3 - r : r >= 4 && c === 0 ? r - 3 : 0;
          if (bonus) {
            const tag = document.createElement("span");
            tag.className = "bonus-tag " + (c === 0 ? "left" : "right");
            tag.dataset.v = "+" + bonus;
            tag.setAttribute("aria-hidden", "true");
            cell.appendChild(tag);
          }

          const label = document.createElement("div");
          label.className = "cell-label";
          label.textContent = "";
          cell.appendChild(label);

          cell.addEventListener("click", () => onCellClick(r, c));
          boardEl.appendChild(cell);
        }
      }
    }

    function createRowBonusLabels() {
      const topTexts = ["+3", "+2", "+1"];
      for (let i = 0; i < 3; i++) {
        const label = document.createElement("div");
        label.className = "bonus-label bonus-label-top";
        label.textContent = topTexts[i];
        label.style.gridRow = String(i + 1);
        label.style.gridColumn = "9";
        boardEl.appendChild(label);
      }

      const bottomTexts = ["+1", "+2", "+3"];
      for (let i = 0; i < 3; i++) {
        const label = document.createElement("div");
        label.className = "bonus-label bonus-label-bottom";
        label.textContent = bottomTexts[i];
        label.style.gridRow = String(5 + i);
        label.style.gridColumn = "1";
        boardEl.appendChild(label);
      }
    }

    function updateBoardDOM() {
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          const idx = r * SIZE + c;
          const cellEl = boardEl.children[idx];
          const data = state.board[r][c];

          cellEl.classList.remove(
            "type-neutral",
            "type-LoD",
            "type-RoM",
            "type-BoD",
            "type-RoX",
            "type-KoS",
            "type-DoA",
            "type-multi",
            "selected"
          );
          cellEl.querySelectorAll(".tile-part, .tile-seam").forEach((el) => el.remove());
          const tileTypes = String(data.type || "neutral").split("+");
          if (tileTypes.length > 1) {
            // Several landscapes on this field: a diagonally split tile.
            cellEl.classList.add("type-multi");
            const n = tileTypes.length;
            tileTypes.forEach((t, i) => {
              const part = document.createElement("div");
              part.className = `tile-part n${n} p${i}`;
              part.style.setProperty("--tile", `url("img/${t}/marker.png")`);
              part.style.setProperty("--tile-bg", TILE_PAPER[t] || "#cbb9ae");
              part.appendChild(document.createElement("div")).className = "sym";
              cellEl.prepend(part);
            });
            const seam = document.createElement("div");
            seam.className = `tile-seam n${n}`;
            cellEl.prepend(seam);
            cellEl.prepend(...cellEl.querySelectorAll(".tile-part"));
          } else {
            cellEl.classList.add("type-" + data.type);
          }
          cellEl.classList.toggle("flow", !!data.flow);

          if (
            state.selected &&
            state.selected.type === "board" &&
            state.selected.row === r &&
            state.selected.col === c
          ) {
            cellEl.classList.add("selected");
          }

          const labelEl = cellEl.querySelector(".cell-label");
          labelEl.textContent = getFieldTypeShortLabel(data.type);

          const oldDie = cellEl.querySelector(".die");
          if (oldDie) oldDie.remove();

          if (data.owner != null && data.value != null) {
            const owner = data.owner;
            const player = state.players[owner];
            const diceSet = player && player.diceSet ? player.diceSet : "numbers";

            const die = document.createElement("div");
            die.className = "die " + (owner === 1 ? "p1" : "p2") + (diceSet === "numbers" ? " numbers" : "");

            if (diceSet === "numbers") {
              die.textContent = data.value;
              let transform = "";
              if ((state.gameMode === "duel" || state.gameMode === "online") && owner === 2) {
                transform = "rotate(180deg)";
              }
              if (data.rotation !== 0) {
                transform += ` rotate(${data.rotation}deg)`;
              }
              die.style.transform = transform || "none";
            } else {
              die.textContent = "";
              const imgPath =
                state.players[1].diceSet === state.players[2].diceSet && owner === 2
                  ? `img/${diceSet}/${data.value}b.png`
                  : `img/${diceSet}/${data.value}.png`;
              const img = document.createElement("img");
              img.src = imgPath;
              img.style.width = "100%";
              img.style.height = "100%";
              img.style.objectFit = "contain";
              img.style.borderRadius = "6px";
              img.alt = `Die ${data.value}`;
              let transform = "";
              if ((state.gameMode === "duel" || state.gameMode === "online") && owner === 2) {
                transform = "rotate(180deg)";
              }
              if (data.rotation !== 0) {
                transform += ` rotate(${data.rotation}deg)`;
              }
              img.style.transform = transform || "none";
              die.appendChild(img);
            }

            cellEl.appendChild(die);
          }
        }
      }
    }

    // Paper colour of each landscape tile, for the sections of a split tile.
    const TILE_PAPER = { RoX: "#c8b5ac", BoD: "#cfbdb4", LoD: "#b3a5a0", RoM: "#ccbab1", KoS: "#c9b5ae", DoA: "#7e94a3" };

    function getFieldTypeShortLabel(type) {
      switch (type) {
        case "neutral":
        case "LoD":
        case "RoM":
        case "BoD":
        case "RoX":
        case "KoS":
        case "DoA":
        default:
          return "";
      }
    }

    function refreshPlayerPanels() {
      [1, 2].forEach((p) => {
        document.getElementById(`p${p}-reserve-count`).textContent = state.players[p].reserve;
        document.getElementById(`p${p}-exile-count`).textContent = state.players[p].exile;
      });
      GameUI.refreshBars();
      updateOnlineUIState();
      updateHistoryButtons();
      updateSaveLoadButtons();
      GameUI.renderManual();
    }

    function renderMiniDice(containerId, count) {
      const container = document.getElementById(containerId);
      if (!container) return;
      container.innerHTML = "";
      const maxIcons = Math.min(count, 5);
      for (let i = 0; i < maxIcons; i++) {
        const d = document.createElement("div");
        d.className = "dice-mini";
        container.appendChild(d);
      }
      if (count > maxIcons) {
        const more = document.createElement("span");
        more.style.fontSize = "0.65rem";
        more.style.color = "var(--muted)";
        more.textContent = `+${count - maxIcons}`;
        container.appendChild(more);
      }
    }

    function clearSelection() {
      state.selected = null;
      state.ringDismissed = false;
      updateBoardDOM();
      updateCurrentDieView();
      document
        .querySelectorAll(".pile")
        .forEach((b) => b.classList.remove("selected"));
    }

    function onCellClick(r, c) {
      if (window.RulesMode && RulesMode.active) {
        RulesMode.onCellClick(r, c);
        return;
      }
      if (state.gameMode === "online" && state.currentPlayer !== onlineState.localPlayer) {
        return;
      }

      const cell = state.board[r][c];
      const hasDie = cell.owner !== null;

      if (hasDie) {
        if (
          state.selected &&
          state.selected.type === "board" &&
          state.selected.row === r &&
          state.selected.col === c
        ) {
          clearSelection();
          return;
        }
        state.selected = { type: "board", row: r, col: c };
        state.ringDismissed = false;
        document
          .querySelectorAll(".pile")
          .forEach((b) => b.classList.remove("selected"));
        updateBoardDOM();
        updateCurrentDieView();
        return;
      }

      if (state.selected) {
        if (state.selected.type === "board") {
          const from = state.board[state.selected.row][state.selected.col];
          if (from && from.owner != null && from.value != null) {
            pushUndoState();
            cell.owner = from.owner;
            cell.value = from.value;
            cell.rotation = from.rotation;
            cell.type = cell.type || "neutral";
            from.owner = null;
            from.value = null;
            from.rotation = 0;
            clearSelection();
            updateBoardDOM();
            if (state.gameMode === "online") {
              sendGameState();
            }
            return;
          }
        }

        if (state.selected.type === "reserve") {
          const p = state.selected.player;
          if (state.players[p].reserve > 0) {
            pushUndoState();
            state.players[p].reserve--;
            cell.owner = p;
            cell.value = 1;
            cell.rotation = 0;
            state.selected = { type: "board", row: r, col: c, manipulated: true };
            document
              .querySelectorAll(".pile")
              .forEach((b) => b.classList.remove("selected"));
            refreshPlayerPanels();
            updateBoardDOM();
            updateCurrentDieView();
            if (state.gameMode === "online") {
              sendGameState();
            }
            return;
          }
        }

        if (state.selected.type === "exile") {
          const p = state.selected.player;
          if (state.players[p].exile > 0) {
            pushUndoState();
            state.players[p].exile--;
            cell.owner = p;
            cell.value = 1;
            cell.rotation = 0;
            state.selected = { type: "board", row: r, col: c, manipulated: true };
            document
              .querySelectorAll(".pile")
              .forEach((b) => b.classList.remove("selected"));
            refreshPlayerPanels();
            updateBoardDOM();
            updateCurrentDieView();
            if (state.gameMode === "online") {
              sendGameState();
            }
            return;
          }
        }
      }

      pushUndoState();
      // only during the first round
      if(state.roundNumber === 1) {
        const index = FIELD_TYPES.indexOf(cell.type);
        const nextIndex = (index + 1) % FIELD_TYPES.length;
        cell.type = FIELD_TYPES[nextIndex];
      }
      
      updateBoardDOM();
      if (state.gameMode === "online") {
        sendGameState();
      }
    }

    function onReserveClick(player) {
      const block = document.getElementById(`p${player}-reserve`);
      const wasSelected =
        state.selected &&
        state.selected.type === "reserve" &&
        state.selected.player === player;

      clearSelection();

      if (!wasSelected) {
        if (state.players[player].reserve <= 0) return;
        state.selected = { type: "reserve", player };
        block.classList.add("selected");
      }

      updateCurrentDieView();
    }

    function onExileClick(player) {
      const block = document.getElementById(`p${player}-exile`);
      const wasSelected =
        state.selected &&
        state.selected.type === "exile" &&
        state.selected.player === player;

      clearSelection();

      if (!wasSelected) {
        if (state.players[player].exile <= 0) return;
        state.selected = { type: "exile", player };
        block.classList.add("selected");
      }

      updateCurrentDieView();
    }

    function moveSelectedBoardDieToReserve(player) {
      if (!state.selected || state.selected.type !== "board") return;
      const { row, col } = state.selected;
      const cell = state.board[row][col];
      if (cell.owner !== player) return;

      pushUndoState();
      state.players[player].reserve++;
      cell.rotation = 0;
      cell.owner = null;
      cell.value = null;
      clearSelection();
      refreshPlayerPanels();
      updateBoardDOM();
      if (state.gameMode === "online") {
        sendGameState();
      }
    }

    function moveSelectedBoardDieToExile(player) {
      if (!state.selected || state.selected.type !== "board") return;
      const { row, col } = state.selected;
      const cell = state.board[row][col];
      if (cell.owner !== player) return;

      pushUndoState();
      state.players[player].exile++;
      cell.rotation = 0;
      cell.owner = null;
      cell.value = null;
      clearSelection();
      refreshPlayerPanels();
      updateBoardDOM();
      if (state.gameMode === "online") {
        sendGameState();
      }
    }

    function moveReserveToExile(player) {
      if (state.players[player].reserve <= 0) return;
      pushUndoState();
      state.players[player].reserve--;
      state.players[player].exile++;
      clearSelection();
      refreshPlayerPanels();
      if (state.gameMode === "online") {
        sendGameState();
      }
    }

    function moveExileToReserve(player) {
      if (state.players[player].exile <= 0) return;
      pushUndoState();
      state.players[player].exile--;
      state.players[player].reserve++;
      clearSelection();
      refreshPlayerPanels();
      if (state.gameMode === "online") {
        sendGameState();
      }
    }

    function rotateSelectedDie(delta) {
      if (state.gameMode === "online" && state.currentPlayer !== onlineState.localPlayer) {
        return;
      }
      if (!state.selected || state.selected.type !== "board") return;
      const { row, col } = state.selected;
      const cell = state.board[row][col];
      if (cell.owner == null || cell.value == null) return;
      pushUndoState();
      let v = cell.value + delta;
      if (v < 1) v = 6;
      if (v > 6) v = 1;
      cell.value = v;
      state.selected.manipulated = true;
      updateBoardDOM();
      updateCurrentDieView();
      if (state.gameMode === "online") {
        sendGameState();
      }
    }

    function rotateSelectedDieVisual(degrees) {
      if (state.gameMode === "online" && state.currentPlayer !== onlineState.localPlayer) {
        return;
      }
      if (!state.selected || state.selected.type !== "board") return;
      const { row, col } = state.selected;
      const cell = state.board[row][col];
      if (cell.owner == null || cell.value == null) return;
      pushUndoState();
      cell.rotation = (cell.rotation + degrees) % 360;
      state.selected.manipulated = true;
      updateBoardDOM();
      updateCurrentDieView();
      if (state.gameMode === "online") {
        sendGameState();
      }
    }

    function updateCurrentDieView() {
      if (window.GameUI) GameUI.renderManual();
      if (!state.selected || state.selected.type !== "board") {
        currentDieBox.classList.add("empty");
        currentDieBox.innerHTML = "No<br />Die";
        currentDieBox.style.backgroundImage = "none";
        currentDieBox.style.background = "transparent";
        currentDieBox.style.borderStyle = "dashed";
        currentDieBox.style.transform = "none";
        return;
      }
      const { row, col } = state.selected;
      const cell = state.board[row][col];
      if (cell.owner == null || cell.value == null) {
        currentDieBox.classList.add("empty");
        currentDieBox.innerHTML = "No<br />Die";
        currentDieBox.style.backgroundImage = "none";
        currentDieBox.style.background = "transparent";
        currentDieBox.style.borderStyle = "dashed";
        currentDieBox.style.transform = "none";
        return;
      }

      const player = state.players[cell.owner];
      const diceSet = player && player.diceSet ? player.diceSet : "numbers";

      currentDieBox.classList.remove("empty");
      currentDieBox.style.borderStyle = "solid";

      const needsOwnerRotation = (state.gameMode === "duel" || state.gameMode === "online") && cell.owner === 2;
      const needsPerspectiveRotation = state.gameMode === "online" && onlineState.localPlayer === 2;

      if (diceSet === "numbers") {
        currentDieBox.innerHTML = String(cell.value);
        currentDieBox.style.backgroundImage = "none";
        currentDieBox.style.background =
          cell.owner === 1
            ? "radial-gradient(circle at 30% 20%, #ff877d, var(--p1-color))"
            : "radial-gradient(circle at 30% 20%, #79b5ff, var(--p2-color))";
        currentDieBox.style.color = "#fff";
        let transform = "";
        if (needsOwnerRotation) transform += " rotate(180deg)";
        if (needsPerspectiveRotation) transform += " rotate(180deg)";
        if (cell.rotation !== 0) transform += ` rotate(${cell.rotation}deg)`;
        currentDieBox.style.transform = transform.trim() || "none";
      } else {
        currentDieBox.innerHTML = "";
        const imgPath =
          state.players[1].diceSet === state.players[2].diceSet && cell.owner === 2
            ? `img/${diceSet}/${cell.value}b.png`
            : `img/${diceSet}/${cell.value}.png`;
        const img = document.createElement("img");
        img.src = imgPath;
        img.style.width = "100%";
        img.style.height = "100%";
        img.style.objectFit = "contain";
        img.style.borderRadius = "6px";
        img.alt = `Die ${cell.value}`;
        let transform = "";
        if (needsOwnerRotation) transform += " rotate(180deg)";
        if (needsPerspectiveRotation) transform += " rotate(180deg)";
        if (cell.rotation !== 0) transform += ` rotate(${cell.rotation}deg)`;
        img.style.transform = transform.trim() || "none";
        currentDieBox.appendChild(img);
        currentDieBox.style.color = "transparent";
        currentDieBox.style.transform = "none";
      }
    }

    function onCounterButtonClick(counterId, delta) {
      let player = counterId.startsWith("p1") ? 1 : 2;
      const field = counterId.endsWith("trigger") ? "trigger" : "victory";
      pushUndoState();
      let value = state.players[player][field] + delta;
      if (value < 0) value = 0;
      if (value > 10) value = 10;
      state.players[player][field] = value;
      document.getElementById(counterId).textContent = value;

      if (state.gameMode === "online") {
        sendGameState();
      }
    }

    function endTurn() {
      pushUndoState();

      if (state.currentPlayer === 2) {
        state.roundNumber++;
      }

      state.currentPlayer = state.currentPlayer === 1 ? 2 : 1;
      clearSelection();
      setStatus("Player " + state.currentPlayer + "'s turn.");
      updateRoundDisplay();
      refreshPlayerPanels();

      if (state.gameMode === "online") {
        sendGameState();
      }
    }

    function updateRoundDisplay() {
      document.getElementById("round-text").textContent = "Round: " + state.roundNumber;
    }

    function updateCardButtons() {
      const p1Btn = document.getElementById("btn-player1-cards");
      const p2Btn = document.getElementById("btn-player2-cards");
      const p1Set = state.players[1].diceSet || "numbers";
      const p2Set = state.players[2].diceSet || "numbers";
      const folder1 = p1Set === "numbers" ? "numbers" : p1Set;
      const folder2 = p2Set === "numbers" ? "numbers" : p2Set;
      const cardFace = (set, folder) => set === "numbers"
        ? `<span style="font-family: var(--display); font-size: 9px; color: var(--paper);">Rules</span>`
        : `<img src="img/${folder}/rules/artwork.png" alt="Rule cards">`;
      p1Btn.innerHTML = cardFace(p1Set, folder1);
      p2Btn.innerHTML = cardFace(p2Set, folder2);
    }

    // --- Lobby / dice set choice ---
    function initLobbyDiceSets() {
      const p1Select = document.getElementById("p1-dice-set");
      const p2Select = document.getElementById("p2-dice-set");

      [p1Select, p2Select].forEach((select) => {
        if (!select) return;
        select.innerHTML = "";
        DICE_SETS.forEach((set) => {
          const opt = document.createElement("option");
          opt.value = set.id;
          opt.textContent = set.label;
          select.appendChild(opt);
        });
        select.value = "RoX";
      });
    }

    const lobbyOverlay = document.getElementById("lobby-overlay");
    const startGameBtn = document.getElementById("start-game-btn");
    startGameBtn.addEventListener("click", () => {
      startNewGame();
    });

    // A game is running: the menu can be closed again with "Back to Game".
    let gameInProgress = false;
    function markGameStarted() {
      gameInProgress = true;
      document.getElementById("btn-close-lobby").style.display = "";
    }

    document.getElementById("btn-lobby").addEventListener("click", () => {
      document.getElementById("btn-close-lobby").style.display = gameInProgress ? "" : "none";
      // Duel on one device: the menu faces the player who opened it.
      lobbyOverlay.classList.toggle("player2", state.gameMode === "duel" && GameUI.actingPlayer() === 2);
      lobbyOverlay.style.display = "flex";
    });

    document.getElementById("btn-close-lobby").addEventListener("click", () => {
      lobbyOverlay.style.display = "none";
    });

    function startNewGameBase(p1Set, p2Set, gameMode) {
      document.getElementById("app").classList.remove("online-player2");
      lobbyOverlay.classList.remove("player2");
      markGameStarted();
      state.currentPlayer = 1;
      state.gameOver = false;
      state.gameMode = gameMode;
      state.roundNumber = 1;
      state.players[1] = { reserve: 15, exile: 0, trigger: 0, victory: 0, diceSet: p1Set };
      state.players[2] = { reserve: 15, exile: 0, trigger: 0, victory: 0, diceSet: p2Set };

      initBoardState();
      buildBoardDOM();
      updateBoardDOM();
      refreshPlayerPanels();
      updateRoundDisplay();
      updateCardButtons();
      clearSelection();
      resetHistory();
      updateSaveLoadButtons();
      setStatus("Player 1's turn.");
    }

    // --- Rules/Karten Overlay ---
    let rulesState = {
      currentPlayer: null,
      currentImageIndex: 0,
      images: []
    };

    const RULES_PER_SET = {
      "numbers": ["artwork", 1, 2, 3, 4, 5, 6, "marker"],
      "LoD": ["artwork", 1, 2, 3, 4, 5, 6, "marker"],
      "RoM": ["artwork", 1, 2, 3, 4, 5, 6, "marker"],
      "BoD": ["artwork", 1, 2, 3, 4, 5, 6, "marker"],
      "RoX": ["artwork", 1, 2, 3, 4, 5, 6, "marker"],
      "KoS": ["artwork", 1, 2, 3, 4, 5, 6, "marker", "rules_1", "rules_2"],
      "DoA": ["artwork", 1, 2, 3, 4, 5, 6, "marker"],
    };
    const globalRules = ["zugablauf", "glossar"];

    function openRulesOverlay(player) {
      const diceSet = state.players[player].diceSet || "numbers";
      const imageList = RULES_PER_SET[diceSet] || [1, 2, 3, 4, 5, 6];
      const folder = diceSet === "numbers" ? "numbers" : diceSet;

      rulesState.currentPlayer = player;
      rulesState.currentImageIndex = 0;
      const setImages = imageList.map(i => `img/${folder}/rules/${i}.png`);
      const globalImages = globalRules.map(i => `img/global/${i}.png`);
      rulesState.images = [...setImages, ...globalImages];

      const overlay = document.getElementById("rules-overlay");
      overlay.style.display = "flex";
      overlay.classList.toggle("player2", state.gameMode === "duel" && state.currentPlayer === 2);

      showRulesImage();
    }

    function closeRulesOverlay() {
      const overlay = document.getElementById("rules-overlay");
      overlay.style.display = "none";
    }

    function showRulesImage() {
      if (rulesState.images.length === 0) return;

      const img = document.getElementById("rules-image");
      const imagePath = rulesState.images[rulesState.currentImageIndex];
      img.src = imagePath;
    }

    function nextRulesImage() {
      rulesState.currentImageIndex = (rulesState.currentImageIndex + 1) % rulesState.images.length;
      showRulesImage();
    }

    function prevRulesImage() {
      rulesState.currentImageIndex = (rulesState.currentImageIndex - 1 + rulesState.images.length) % rulesState.images.length;
      showRulesImage();
    }

    // --- Online UI on/off ---
    function enableAllGameElements() {
      document.querySelectorAll(".cell").forEach(cell => {
        cell.style.pointerEvents = "auto";
        cell.style.opacity = "1";
      });

      document.querySelectorAll(".pile").forEach(block => {
        block.style.pointerEvents = "auto";
        block.style.opacity = "1";
      });

      document.querySelectorAll(".track button").forEach(btn => {
        btn.disabled = false;
        btn.style.opacity = "1";
      });

      const endTurn = document.getElementById("btn-end-turn");
      if (endTurn) {
        endTurn.disabled = false;
        endTurn.style.opacity = "1";
      }

      const plusBtn = document.getElementById("btn-die-plus");
      const minusBtn = document.getElementById("btn-die-minus");
      if (plusBtn) {
        plusBtn.disabled = false;
        plusBtn.style.opacity = "1";
      }
      if (minusBtn) {
        minusBtn.disabled = false;
        minusBtn.style.opacity = "1";
      }
    }

    function disableGameElementsForInactivePlayer() {
      document.querySelectorAll(".cell").forEach(cell => {
        cell.style.pointerEvents = "none";
        cell.style.opacity = "0.5";
      });

      document.querySelectorAll(".pile").forEach(block => {
        block.style.pointerEvents = "none";
        block.style.opacity = "0.5";
      });

      document.querySelectorAll(".track button").forEach(btn => {
        btn.disabled = true;
        btn.style.opacity = "0.5";
      });

      const endTurn = document.getElementById("btn-end-turn");
      if (endTurn) {
        endTurn.disabled = true;
        endTurn.style.opacity = "0.5";
      }

      const plusBtn = document.getElementById("btn-die-plus");
      const minusBtn = document.getElementById("btn-die-minus");
      if (plusBtn) {
        plusBtn.disabled = true;
        plusBtn.style.opacity = "0.5";
      }
      if (minusBtn) {
        minusBtn.disabled = true;
        minusBtn.style.opacity = "0.5";
      }

      // Karten-Buttons & Lobby bleiben aktiv
    }

    function updateOnlineUIState() {
      if (state.gameMode !== "online") {
        enableAllGameElements();
        return;
      }

      const localActs = window.RulesMode && RulesMode.active
        ? RulesMode.localCanAct()
        : state.currentPlayer === onlineState.localPlayer;
      if (localActs) {
        enableAllGameElements();
      } else {
        disableGameElementsForInactivePlayer();
      }
    }

    // --- Event handlers for reserve/exile etc. ---
    function attachBoardListeners() {
      document
        .getElementById("p1-reserve")
        .addEventListener("click", () => {
          if (
            state.selected &&
            state.selected.type === "board" &&
            state.board[state.selected.row][state.selected.col].owner === 1
          ) {
            if (state.selected.manipulated) {
              onReserveClick(1);
            } else {
              moveSelectedBoardDieToReserve(1);
            }
          } else if (
            state.selected &&
            state.selected.type === "exile" &&
            state.selected.player === 1
          ) {
            moveExileToReserve(1);
          } else if (
            state.selected &&
            state.selected.type === "reserve" &&
            state.selected.player === 1
          ) {
            clearSelection();
          } else {
            onReserveClick(1);
          }
        });

      document
        .getElementById("p2-reserve")
        .addEventListener("click", () => {
          if (
            state.selected &&
            state.selected.type === "board" &&
            state.board[state.selected.row][state.selected.col].owner === 2
          ) {
            if (state.selected.manipulated) {
              onReserveClick(2);
            } else {
              moveSelectedBoardDieToReserve(2);
            }
          } else if (
            state.selected &&
            state.selected.type === "exile" &&
            state.selected.player === 2
          ) {
            moveExileToReserve(2);
          } else if (
            state.selected &&
            state.selected.type === "reserve" &&
            state.selected.player === 2
          ) {
            clearSelection();
          } else {
            onReserveClick(2);
          }
        });

      document.getElementById("p1-exile").addEventListener("click", () => {
        if (
          state.selected &&
          state.selected.type === "board" &&
          state.board[state.selected.row][state.selected.col].owner === 1
        ) {
          if (state.selected.manipulated) {
            onExileClick(1);
          } else {
            moveSelectedBoardDieToExile(1);
          }
        } else if (
          state.selected &&
          state.selected.type === "reserve" &&
          state.selected.player === 1
        ) {
          moveReserveToExile(1);
        } else if (
          state.selected &&
          state.selected.type === "exile" &&
          state.selected.player === 1
        ) {
          clearSelection();
        } else {
          onExileClick(1);
        }
      });

      document.getElementById("p2-exile").addEventListener("click", () => {
        if (
          state.selected &&
          state.selected.type === "board" &&
          state.board[state.selected.row][state.selected.col].owner === 2
        ) {
          if (state.selected.manipulated) {
            onExileClick(2);
          } else {
            moveSelectedBoardDieToExile(2);
          }
        } else if (
          state.selected &&
          state.selected.type === "reserve" &&
          state.selected.player === 2
        ) {
          moveReserveToExile(2);
        } else if (
          state.selected &&
          state.selected.type === "exile" &&
          state.selected.player === 2
        ) {
          clearSelection();
        } else {
          onExileClick(2);
        }
      });

      document.querySelectorAll("button[data-counter]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-counter");
          const delta = parseInt(btn.getAttribute("data-delta"), 10);
          onCounterButtonClick(id, delta);
        });
      });

      document
        .getElementById("btn-end-turn")
        .addEventListener("click", endTurn);

      document
        .getElementById("btn-die-plus")
        .addEventListener("click", () => rotateSelectedDie(1));
      document
        .getElementById("btn-die-minus")
        .addEventListener("click", () => rotateSelectedDieVisual(90));

      document
        .getElementById("btn-player1-cards")
        .addEventListener("click", () => openRulesOverlay(1));
      document
        .getElementById("btn-player2-cards")
        .addEventListener("click", () => openRulesOverlay(2));

      document
        .getElementById("btn-close-rules")
        .addEventListener("click", closeRulesOverlay);

      document
        .getElementById("rules-prev")
        .addEventListener("click", prevRulesImage);
      document
        .getElementById("rules-next")
        .addEventListener("click", nextRulesImage);

      document
        .getElementById("rules-image")
        .addEventListener("click", (e) => {
          const rect = e.target.getBoundingClientRect();
          const x = e.clientX - rect.left;
          if (x < rect.width / 2) prevRulesImage();
          else nextRulesImage();
        });

      // NEU: Undo / Redo
      document.getElementById("btn-undo").addEventListener("click", undo);
      document.getElementById("btn-redo").addEventListener("click", redo);

      // NEU: Speichern / Laden
      document.getElementById("btn-save").addEventListener("click", () => {
        if (state.gameMode === "online" && state.currentPlayer !== onlineState.localPlayer) {
          return;  // silently ignored
        }
        exportGameStateToFile();
      });

      document.getElementById("btn-load").addEventListener("click", () => {
        if (state.gameMode === "online" && state.currentPlayer !== onlineState.localPlayer) {
          return;  // silently ignored
        }
        document.getElementById("load-file-input").click();
      });

      document.getElementById("load-file-input").addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const json = JSON.parse(ev.target.result);
            const snapshot = json.snapshot || json;
            applyStateSnapshot(snapshot);
            if (window.RulesMode) {
              if (snapshot.rulesGame) RulesMode.load(snapshot.rulesGame, { resetHistory: true });
              else RulesMode.stop();
            }
            updateBoardDOM();
            refreshPlayerPanels();
            updateRoundDisplay();
            updateCurrentDieView();
            updateCardButtons();
            resetHistory();
            setStatusFromState();
            updateSaveLoadButtons();
            markGameStarted();
            alert("Save loaded.");
          } catch (err) {
            console.error(err);
            alert("Error loading file.");
          }
        };
        reader.readAsText(file);
        e.target.value = "";
      });
    }

    // --- Speichern / Laden ---
    function exportGameStateToFile() {
      const snapshot = createStateSnapshot();
      if (window.RulesMode && RulesMode.active) snapshot.rulesGame = RulesMode.game;
      const data = {
        version: 1,
        snapshot
      };
      const jsonStr = JSON.stringify(data, null, 2);
      const blob = new Blob([jsonStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const ts = new Date().toISOString().replace(/[:T]/g, "-").slice(0, 19);
      a.href = url;
      a.download = "dicewar-save-" + ts + ".json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // --- Online mode (lobby and transport in net/online.js) ---
    const onlineState = {
      localPlayer: null,
    };

    /** Everything the opponent needs to show the current position. */
    function buildGameSnapshot() {
      return {
        state: state,
        currentPlayer: state.currentPlayer,
        selected: state.selected,
        rulesGame: window.RulesMode && RulesMode.active ? RulesMode.game : null,
      };
    }

    function sendGameState() {
      if (state.gameMode === "online" && window.Online) Online.pushState(buildGameSnapshot());
    }

    function handleRemoteGameState(data, { resetHistory = false } = {}) {
      state.board = data.state.board;
      state.players = data.state.players;
      state.currentPlayer = data.currentPlayer;
      state.selected = data.selected;
      state.roundNumber = data.state.roundNumber;

      updateBoardDOM();
      refreshPlayerPanels();
      updateRoundDisplay();
      setStatus(GameUI.playerName ? GameUI.playerName(state.currentPlayer) + (GameUI.playerName(state.currentPlayer) === "You" ? "r turn." : "'s turn.") : "Player " + state.currentPlayer + "'s turn.");
      if (window.RulesMode) {
        if (data.rulesGame) RulesMode.load(data.rulesGame, { resetHistory });
        else if (RulesMode.active) RulesMode.stop();
      }
      updateOnlineUIState();
    }

    function updatePerspective() {
      const app = document.getElementById("app");
      if (state.gameMode === "online" && onlineState.localPlayer === 2) {
        app.classList.add("online-player2");
      } else {
        app.classList.remove("online-player2");
      }
      GameUI.layout();
    }

    /** Local board for an online game (both players). */
    function setupOnlineGame(meta, localPlayer) {
      if (window.RulesMode) RulesMode.stop();
      onlineState.localPlayer = localPlayer;
      startNewGameBase(meta.set1, meta.set2, "online");
      state.currentPlayer = meta.startingPlayer || 1;
      updatePerspective();
      updateOnlineUIState();
      document.getElementById("lobby-overlay").style.display = "none";
    }

    /** Starting position of an online game; built by the player who accepts. */
    function initOnlineGameState(meta) {
      if (meta.rules && window.RulesMode && RulesMode.isAvailable(meta.set1, meta.set2)) {
        RulesMode.start(meta.set1, meta.set2, {
          locations: Landscapes.parse(meta.location),
          riverCol: meta.riverCol,
          startingPlayer: meta.startingPlayer,
        });
      } else {
        placeLandscapeTiles(Landscapes.parse(meta.location), meta.riverCol);
        setStatus(GameUI.playerName(state.currentPlayer) === "You" ? "Your turn." : GameUI.playerName(state.currentPlayer) + "'s turn.");
      }
    }

    // --- Updated startNewGame to handle online modes ---
    const originalStartNewGame = startNewGameBase;
    async function startNewGame() {
      const gameModeSelect = document.getElementById("game-mode-select");
      const gameMode = gameModeSelect ? gameModeSelect.value : "duel";
      const p1Select = document.getElementById("p1-dice-set");
      const p2Select = document.getElementById("p2-dice-set");
      const p1Set = p1Select ? p1Select.value : "numbers";
      const p2Set = p2Select ? p2Select.value : "numbers";

      if (gameMode === "online") {
        if (window.Online) Online.openLobby();
        else alert("The online lobby is still loading. Please try again in a moment.");
        return;
      }
      if (window.Online && Online.inGame() && !Online.leaveForOtherMode()) return;
      if (window.Online && !Online.inGame()) Online.leaveForOtherMode();
      if (window.RulesMode) RulesMode.stop();
      if (gameMode === "ai") {
        if (!window.RulesMode || !RulesMode.isAvailable(p1Set, p2Set)) {
          alert("The Numbers set has no rules, so it can't be played against the AI. Choose another dice set.");
          return;
        }
        originalStartNewGame(p1Set, p2Set, "ai");
        document.getElementById("lobby-overlay").style.display = "none";
        const locations = chosenLocations();
        const level = document.getElementById("ai-level").value;
        RulesMode.start(p1Set, p2Set, { locations, ai: { player: 2, level }, riverCol: chosenRiverCol() });
        return;
      }
      {
        originalStartNewGame(p1Set, p2Set, gameMode);
        const lobbyOverlay = document.getElementById("lobby-overlay");
        lobbyOverlay.style.display = "none";
        if (!rulesModeChosen(p1Set, p2Set)) placeLandscapeTiles();
        startRulesModeIfChosen(p1Set, p2Set);
      }
    }

    // Fixed tile positions of the landscapes (row, column from the top-left).
    // The Camp is placed by the players (click a field in round 1); the River
    // lies in the three middle rows of the column chosen in the lobby.
    const LANDSCAPE_TILES = {
      craters: [[2, 1], [4, 5]],
      oracle: [[3, 3]],
      ruins: [[1, 5], [3, 3], [5, 1]],
      knoll: [[2, 2], [2, 4], [4, 2], [4, 4]],
    };

    /** Without rules mode: show the chosen landscapes' tiles on the board.
     *  A field with several tiles gets the type "DoA+BoD+LoD" (split tile). */
    function placeLandscapeTiles(ids = chosenLocations(), riverCol = chosenRiverCol()) {
      ids = Landscapes.parse(ids);
      if (!ids.length) return;
      for (const id of ids) {
        const fields = id === "river" ? [2, 3, 4].map((r) => [r, riverCol]) : LANDSCAPE_TILES[id] || [];
        const type = Landscapes.typeOf(id);
        for (const [r, c] of fields) {
          const cell = state.board[r][c];
          const types = cell.type && cell.type !== "neutral" ? cell.type.split("+") : [];
          if (!types.includes(type)) types.push(type);
          cell.type = types.join("+");
        }
      }
      updateBoardDOM();
      if (state.gameMode === "online") sendGameState();
    }

    // --- Rules mode (engine/ + ui/rules-mode.js) ---
    function chosenLocations() {
      return Landscapes.selected(document.getElementById("use-location"));
    }

    function chosenRiverCol() {
      return Number(document.getElementById("river-col").value);
    }

    function rulesModeChosen(p1Set, p2Set) {
      return window.RulesMode
        && RulesMode.isAvailable(p1Set, p2Set)
        && document.getElementById("enforce-rules").checked;
    }

    function startRulesModeIfChosen(p1Set, p2Set) {
      if (!rulesModeChosen(p1Set, p2Set)) return;
      const locations = chosenLocations();
      RulesMode.start(p1Set, p2Set, { locations, riverCol: chosenRiverCol() });
    }

    function updateRulesOptions() {
      const mode = document.getElementById("game-mode-select").value;
      // The Numbers set has no rules, so the AI can't play with it.
      for (const id of ["p1-dice-set", "p2-dice-set"]) {
        const sel = document.getElementById(id);
        const opt = sel.querySelector('option[value="numbers"]');
        if (opt) opt.disabled = mode === "ai";
        if (mode === "ai" && sel.value === "numbers") sel.value = "RoX";
      }
      const p1Set = document.getElementById("p1-dice-set").value;
      const p2Set = document.getElementById("p2-dice-set").value;
      document.getElementById("p1-set-title").textContent = mode === "ai" ? "Your Dice Set" : "Player 1 – Dice Set";
      document.getElementById("p2-set-title").textContent = mode === "ai" ? "AI Dice Set" : "Player 2 – Dice Set";
      const online = mode === "online";
      document.getElementById("lobby-config").querySelectorAll(".lobby-player-config").forEach((el, i) => {
        if (i > 0) el.style.display = online ? "none" : "";
      });
      document.getElementById("start-game-btn").textContent = online ? "Enter Lobby" : "Start New Game";
      const available = window.RulesMode && RulesMode.isAvailable(p1Set, p2Set) && !online;
      document.getElementById("rules-options").style.display = available ? "flex" : "none";
      document.getElementById("enforce-rules-label").style.display = mode === "ai" ? "none" : "flex";
      document.getElementById("ai-level-label").style.display = mode === "ai" ? "flex" : "none";
      document.getElementById("ai-note").style.display = mode === "ai" ? "block" : "none";
      document.getElementById("river-col-label").style.display = chosenLocations().includes("river") ? "flex" : "none";
    }

    Landscapes.render(document.getElementById("use-location"));
    ["p1-dice-set", "p2-dice-set", "game-mode-select", "enforce-rules", "use-location"].forEach((id) =>
      document.getElementById(id).addEventListener("change", updateRulesOptions));
    window.addEventListener("rules-mode-ready", updateRulesOptions);
    window.addEventListener("rules-mode-ready", () => {
      const sel = document.getElementById("anim-speed");
      sel.value = RulesMode.getAnimationSpeed();
      sel.addEventListener("change", () => RulesMode.setAnimationSpeed(sel.value));
    });

    // In rules mode, Reserve and Exile are managed by the engine only.
    document.addEventListener("click", (e) => {
      if (window.RulesMode && RulesMode.active && e.target.closest(".pile")) {
        e.stopPropagation();
      }
    }, true);

    // --- Init ---
    initBoardState();
    buildBoardDOM();
    updateBoardDOM();
    refreshPlayerPanels();
    attachBoardListeners();
    initLobbyDiceSets();
    updateRoundDisplay();
    updateSaveLoadButtons();
    updateHistoryButtons();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>

  <script type="module" src="net/online.js"></script>
