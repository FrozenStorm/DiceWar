<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DiceWar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2b2a29" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" sizes="180x180" href="icon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icon/favicon-16x16.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="icon" href="icon/favicon.ico" sizes="any">
  <link rel="icon" href="icon/android-chrome-192x192.png" sizes="192x192" type="image/png">
  <link rel="icon" href="icon/android-chrome-512x512.png" sizes="512x512" type="image/png">
  <style>
    /* Board-game look: parchment panels, slate title bars and the board's own map.
       Portrait: opponent dock, board, own dock. Landscape: board left, docks right. */
    @font-face { font-family: "Cinzel"; src: url("fonts/cinzel.woff2") format("woff2"); font-weight: 400 900; font-display: swap; }
    @font-face { font-family: "Crimson Text"; src: url("fonts/crimson-text-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "Crimson Text"; src: url("fonts/crimson-text-600.woff2") format("woff2"); font-weight: 600; font-display: swap; }
    @font-face { font-family: "Crimson Text"; src: url("fonts/crimson-text-400-italic.woff2") format("woff2"); font-style: italic; font-weight: 400; font-display: swap; }

    :root {
      --frame: #2b2a29;
      --frame-2: #3a3836;
      --ink: #2c241c;
      --ink-soft: #5c5245;
      --edge: #1e1a16;
      --paper: #e8dfca;
      --paper-2: #d9cfb8;
      --slate: #56656f;
      --slate-2: #4c5a64;
      --tile: #7a6d60;
      --p1: #b8402f;
      --p2: #2f6fa8;
      --set-color: #56656f;
      --accent: #e8b54a;
      --hint: #17918f;
      --attack: #b8402f;
      --display: "Cinzel", "Trajan Pro", Georgia, serif;
      --body: "Crimson Text", Georgia, "Times New Roman", serif;
      /* still used by the dice rendering code */
      --p1-color: #1c1c1c;
      --p2-color: #1c1c1c;
      --text: #f4eedf;
      --muted: #b9ad99;
      --panel-bg: #33302d;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body { margin: 0; height: 100%; overflow: hidden; }

    body {
      background: radial-gradient(circle at 50% 40%, var(--frame-2), #1d1c1b);
      color: var(--ink);
      font-family: var(--body);
      -webkit-user-select: none;
      user-select: none;
    }

    button { font: inherit; color: inherit; cursor: pointer; }
    button:disabled { cursor: default; opacity: 0.45; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .paper {
      background:
        radial-gradient(circle at 15% 30%, rgba(120, 90, 50, 0.16), transparent 45%),
        radial-gradient(circle at 85% 70%, rgba(110, 80, 40, 0.14), transparent 40%),
        var(--paper);
      border: 2px solid var(--edge);
      border-radius: 10px;
      color: var(--ink);
    }

    /* ---------- App frame ---------- */
    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: max(6px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left));
      max-width: 900px;
      margin: 0 auto;
    }

    .dock { display: flex; flex-direction: column; gap: 6px; flex: 0 0 auto; min-height: 0; }
    .dock > * { flex-shrink: 0; }
    #dock-top { justify-content: flex-start; flex: 1 0 auto; }
    #dock-bottom { justify-content: flex-end; }
    .dock > .hint { order: 1; }
    .dock > .player-bar { order: 2; }
    .dock > .toolbar { order: 3; }
    #dock-top > .player-bar { order: 0; }

    /* Duel on one device: the board stays put, the dock at the top faces player 2,
       and the controls move to the side of the player who acts. */
    #app.duel #dock-top { transform: rotate(180deg); justify-content: flex-end; }
    #app.duel #dock-top > .player-bar { order: 2; }
    #app.duel .dock { flex: 0 0 auto; }
    #app.duel #board-area { max-height: none; }

    #board-area {
      flex: 1000 1 auto;
      min-height: 0;
      max-height: calc(min(100vw, 900px) - 12px);
      container-type: size;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* ---------- Player bar: the score tracks of the board ---------- */
    .player-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 6px;
      transition: box-shadow 0.2s;
    }
    .player-bar.active { box-shadow: 0 0 0 2px var(--player), 0 0 12px var(--player); }
    .player-bar[data-player="1"] { --player: var(--p1); }
    .player-bar[data-player="2"] { --player: var(--p2); }

    .card-btn {
      width: 38px; height: 50px; flex: 0 0 auto;
      padding: 0; border: 1px solid var(--edge); border-radius: 4px;
      background: var(--frame) center / cover no-repeat;
      overflow: hidden;
    }
    .card-btn img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .pile {
      position: relative;
      flex: 0 0 auto;
      width: 36px;
      display: flex; flex-direction: column; align-items: center;
      padding: 0; border: 0; border-radius: 6px; background: transparent;
    }
    .pile img { height: 28px; width: auto; pointer-events: none; }
    .pile .count { font-family: var(--display); font-weight: 700; font-size: 13px; line-height: 1; }
    .pile.selected { box-shadow: 0 0 0 2px var(--accent); background: rgba(232, 181, 74, 0.25); }
    #app.rules-mode .pile { cursor: default; }

    .tracks { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .bar-name {
      font-family: var(--display); font-weight: 700; font-size: 11px; letter-spacing: 0.04em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-soft);
    }
    .bar-name b { color: var(--player); }
    .track { display: flex; align-items: center; gap: 2px; }
    .track > img { width: 20px; height: 15px; object-fit: contain; flex: 0 0 auto; margin-right: 2px; }
    .track button {
      flex: 1 1 0; min-width: 0; max-width: 40px; height: 18px; padding: 0;
      border: 0; border-radius: 2px;
      background: var(--tile); color: #efe8da;
      box-shadow: inset 0 0 0 1px #3b3128;
      font-family: var(--display); font-weight: 600; font-size: 11px; line-height: 18px;
    }
    .track button.on { background: var(--player); color: #fff; box-shadow: 0 0 0 1px var(--edge), 0 0 6px var(--player); }
    .track button.plus { box-shadow: inset 0 0 0 2px var(--player); }
    #app.rules-mode .track button { cursor: default; }

    /* ---------- Hint strip: looks like a section of a rule card ---------- */
    .hint { overflow: hidden; padding: 0; }
    .hint-title {
      padding: 3px 10px;
      background: linear-gradient(rgba(255,255,255,0.12), rgba(0,0,0,0.12)), var(--set-color);
      border-bottom: 1px solid var(--edge);
      font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: 0.04em;
      color: #f4eedf; text-transform: uppercase;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .hint-body { display: flex; align-items: center; gap: 8px; padding: 5px 6px 5px 10px; min-height: 44px; }
    .hint-text { flex: 1; min-width: 0; font-size: 16px; line-height: 1.25; }
    .hint-text .msg { display: block; font-style: italic; color: #7a2a1e; font-size: 14px; }
    .hint-buttons { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; max-width: 62%; }
    .hint-buttons .btn {
      min-height: 36px; padding: 4px 10px;
      border: 1px solid var(--edge); border-radius: 8px;
      background: var(--set-color); color: #f4eedf;
      font-family: var(--display); font-weight: 600; font-size: 12px; line-height: 1.1;
    }
    .hint-buttons .btn.secondary { background: var(--paper-2); color: var(--ink); }

    /* ---------- Toolbar ---------- */
    .toolbar { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; }
    .toolbar button {
      height: 40px; border: 1px solid #4a4440; border-radius: 8px;
      background: #33302d; color: var(--paper);
      font-family: var(--display); font-weight: 600; font-size: 11px; letter-spacing: 0.03em;
      display: flex; align-items: center; justify-content: center; gap: 5px;
    }
    .toolbar svg { width: 16px; height: 16px; flex: 0 0 auto; }

    /* ---------- Board ---------- */
    #board {
      width: min(100cqw, 100cqh);
      height: min(100cqw, 100cqh);
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      grid-template-rows: repeat(7, minmax(0, 1fr));
      border: 3px solid var(--edge);
      border-radius: 4px;
      background: #6f6a4e url("img/ui/board.jpg") center / 100% 100% no-repeat;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6);
    }

    .cell {
      position: relative;
      min-width: 0; min-height: 0;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }

    .cell::before {
      content: "";
      position: absolute;
      inset: 8%;
      pointer-events: none;
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
    }
    .cell.type-LoD::before { background-image: url("img/LoD/marker.png"); }
    .cell.type-RoM::before { background-image: url("img/RoM/marker.png"); }
    .cell.type-BoD::before { background-image: url("img/BoD/marker.png"); }
    .cell.type-RoX::before { background-image: url("img/RoX/marker.png"); }
    .cell.type-KoS::before { background-image: url("img/KoS/marker.png"); }
    .cell.type-DoA::before { background-image: url("img/DoA/marker.png"); }

    /* Several landscape tiles on one field: diagonally split tile, one part per landscape */
    /* Each part is a section of the tile in the tile's paper colour, with the
       symbol shrunk, centred in the section and faded out at its edges. */
    .cell .tile-part { position: absolute; inset: 8%; pointer-events: none; background: var(--tile-bg); }
    .cell .tile-part .sym {
      position: absolute; background: var(--tile) center / contain no-repeat;
      -webkit-mask-image: radial-gradient(closest-side, #000 72%, transparent 100%);
      mask-image: radial-gradient(closest-side, #000 72%, transparent 100%);
    }
    .cell .tile-part.n2.p0 .sym { left: -3%; top: -3%; width: 72%; height: 72%; }
    .cell .tile-part.n2.p1 .sym { left: 31%; top: 31%; width: 72%; height: 72%; }
    .cell .tile-part.n3.p0 .sym { left: -3%; top: -3%; width: 50%; height: 50%; }
    .cell .tile-part.n3.p1 .sym { left: 19%; top: 19%; width: 62%; height: 62%; }
    .cell .tile-part.n3.p2 .sym { left: 53%; top: 53%; width: 50%; height: 50%; }
    .cell .tile-part.n2.p0 { clip-path: polygon(0 0, 100% 0, 0 100%); }
    .cell .tile-part.n2.p1 { clip-path: polygon(100% 0, 100% 100%, 0 100%); }
    .cell .tile-part.n3.p0 { clip-path: polygon(0 0, 67% 0, 0 67%); }
    .cell .tile-part.n3.p1 { clip-path: polygon(67% 0, 100% 0, 100% 33%, 33% 100%, 0 100%, 0 67%); }
    .cell .tile-part.n3.p2 { clip-path: polygon(100% 33%, 100% 100%, 33% 100%); }
    .cell .tile-seam { position: absolute; inset: 8%; pointer-events: none; }
    .cell .tile-seam.n2 { background: linear-gradient(to bottom right, transparent calc(50% - 1px), rgba(43, 34, 24, 0.9) calc(50% - 1px), rgba(43, 34, 24, 0.9) calc(50% + 1px), transparent calc(50% + 1px)); }
    .cell .tile-seam.n3 { background: linear-gradient(to bottom right, transparent calc(33.5% - 1px), rgba(43, 34, 24, 0.9) calc(33.5% - 1px), rgba(43, 34, 24, 0.9) calc(33.5% + 1px), transparent calc(33.5% + 1px), transparent calc(66.5% - 1px), rgba(43, 34, 24, 0.9) calc(66.5% - 1px), rgba(43, 34, 24, 0.9) calc(66.5% + 1px), transparent calc(66.5% + 1px)); }

    /* DoA River: fields in the three middle rows where the flow pushes creatures */
    .cell.flow { background: linear-gradient(90deg, rgba(40, 110, 170, 0.12), rgba(40, 110, 170, 0.32)); }

    .cell.selected { background: rgba(240, 200, 120, 0.35); box-shadow: inset 0 0 0 2px var(--edge), inset 0 0 0 4px var(--accent); }
    .cell.hint { background: rgba(23, 145, 143, 0.38); box-shadow: inset 0 0 0 2px #0f6463, inset 0 0 0 4px rgba(244, 238, 223, 0.7); }
    .cell.hint-attack { background: rgba(184, 64, 47, 0.38); box-shadow: inset 0 0 0 2px #6e1c12, inset 0 0 0 4px rgba(244, 238, 223, 0.7); }
    .cell.in-path { box-shadow: inset 0 0 0 3px var(--accent); }

    .cell-label { display: none; }

    /* Field bonus markers: triangles on the board edge as on the printed board.
       Right edge (+3/+2/+1 for the player moving up): brown with light text.
       Left edge (for the player moving down): parchment with dark text, which
       faces player 2 in a duel on one device. */
    .bonus-tag {
      position: absolute; top: 50%; z-index: 1; pointer-events: none;
      transform: translateY(-50%);
      height: 66%; aspect-ratio: 0.62;
      background: #2b2420;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.45));
    }
    .bonus-tag::after {
      content: attr(data-v);
      position: absolute; inset: 0;
      display: flex; align-items: center;
      font-family: var(--display); font-weight: 700; font-size: clamp(9px, 2.9cqmin, 20px); line-height: 1;
      letter-spacing: -0.02em;
    }
    .bonus-tag.right { right: 0; clip-path: polygon(100% 0, 100% 100%, 0 50%); }
    .bonus-tag.right::after {
      justify-content: flex-end; padding-right: 11%;
      background: #9c8a70; color: #f6f0e2;
      clip-path: polygon(calc(100% - 1.5px) 3px, calc(100% - 1.5px) calc(100% - 3px), 3px 50%);
    }
    .bonus-tag.left { left: 0; clip-path: polygon(0 0, 100% 50%, 0 100%); }
    .bonus-tag.left::after {
      justify-content: flex-start; padding-left: 11%;
      background: #e8dcc0; color: #3b3127;
      clip-path: polygon(1.5px 3px, calc(100% - 3px) 50%, 1.5px calc(100% - 3px));
    }
    /* Text turned by 180 degrees: the inner triangle is mirrored so it still fits its outline. */
    #app.duel .bonus-tag.left::after, #app.online-player2 .bonus-tag.left::after {
      rotate: 180deg; justify-content: flex-end; padding: 0 11% 0 0;
      clip-path: polygon(calc(100% - 1.5px) 3px, calc(100% - 1.5px) calc(100% - 3px), 3px 50%);
    }
    #app.online-player2 .bonus-tag.right::after {
      rotate: 180deg; justify-content: flex-start; padding: 0 0 0 11%;
      clip-path: polygon(1.5px 3px, calc(100% - 3px) 50%, 1.5px calc(100% - 3px));
    }

    .die {
      position: relative;
      z-index: 2;
      width: 80%;
      aspect-ratio: 1 / 1;
      border-radius: 14%;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--display); font-weight: 700; color: #fff;
      font-size: clamp(12px, 4cqmin, 22px);
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.55);
      background-position: center; background-repeat: no-repeat; background-size: contain;
    }
    /* Dice with artwork: no player tint, the die image is the die. */
    .die:has(> img) { background: transparent; border-radius: 6px; }
    /* Numbers set (no artwork): light dice for player 1, dark dice for player 2 */
    .die.numbers.p1 { background: radial-gradient(circle at 30% 20%, #fbf6ea, #d9cfb8); color: var(--ink); box-shadow: 0 0 0 1px var(--edge), 0 3px 6px rgba(0, 0, 0, 0.55); }
    .die.numbers.p2 { background: radial-gradient(circle at 30% 20%, #5a5550, #1c1c1c); color: #f4eedf; box-shadow: 0 0 0 1px var(--edge), 0 3px 6px rgba(0, 0, 0, 0.55); }

    /* Online, player 2: the board is seen from the other side. */
    #app.online-player2 #board { transform: rotate(180deg); }
    #app.online-player2 .cell::before { transform: rotate(180deg); }

    /* ---------- Radial action menu ---------- */
    #ring-layer { position: absolute; inset: 0; z-index: 20; display: none; }
    #ring-layer.open { display: block; }
    /* The ring may reach over the docks: lift the whole board area above them. */
    #board-area.ring-open { z-index: 30; }
    #ring-backdrop { position: absolute; background: rgba(30, 24, 18, 0.45); }
    #ring-svg { position: absolute; overflow: visible; filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.6)); }
    #ring-svg .seg { cursor: pointer; }
    #ring-svg .seg path { stroke: var(--edge); stroke-width: 2; }
    #ring-svg .seg:hover path, #ring-svg .seg:focus path { filter: brightness(1.15); }
    #ring-svg .seg:focus { outline: none; }
    #ring-svg .seg.disabled { cursor: default; }
    #ring-svg text { pointer-events: none; }

    /* ---------- Overlays (lobby, rule cards, online) ---------- */
    .overlay {
      position: fixed; inset: 0; z-index: 1000;
      display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      padding: 20px;
      background: rgba(20, 18, 16, 0.92);
    }
    .overlay h1, .overlay h2 { font-family: var(--display); margin: 0; letter-spacing: 0.04em; }

    #lobby-overlay { display: flex; overflow-y: auto; justify-content: safe center; }
    .lobby-card { width: 100%; max-width: 360px; padding: 0; overflow: hidden; flex: 0 0 auto; }
    .lobby-card h1 {
      padding: 8px 14px; font-size: 24px; text-align: center; color: #f4eedf;
      background: linear-gradient(#66757f, #4c5a64); border-bottom: 1px solid var(--edge);
    }
    .lobby-card .lobby-inner { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; }
    .lobby-card p { margin: 0; font-size: 15px; line-height: 1.3; color: var(--ink-soft); }
    #lobby-config, #rules-options { display: flex; flex-direction: column; gap: 8px; }
    #rules-options { display: none; }
    .lobby-player-config label, #rules-options label {
      display: flex; flex-direction: column; gap: 3px;
      font-family: var(--display); font-weight: 600; font-size: 12px; letter-spacing: 0.03em;
    }
    #rules-options #enforce-rules-label { flex-direction: row; align-items: center; gap: 8px; }
    .lobby-card select {
      width: 100%; min-height: 40px; padding: 4px 8px;
      border: 1px solid var(--edge); border-radius: 6px;
      background: #f3ecdc; color: var(--ink);
      font-family: var(--body); font-size: 16px;
    }
    .lobby-card .field-title { font-family: var(--display); font-weight: 600; font-size: 12px; letter-spacing: 0.03em; }
    .landscape-picks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 3px; }
    .landscape-picks .pick {
      display: flex; flex-direction: row; align-items: center; gap: 6px;
      min-height: 40px; padding: 3px 6px; cursor: pointer;
      border: 1px solid var(--edge); border-radius: 6px; background: #f3ecdc; color: var(--ink);
      font-family: var(--body); font-size: 15px; font-weight: 400; letter-spacing: 0;
    }
    .landscape-picks .pick input { position: absolute; opacity: 0; pointer-events: none; }
    .landscape-picks .pick img { width: 28px; height: 28px; border-radius: 3px; flex: 0 0 auto; opacity: 0.55; filter: grayscale(0.6); }
    .landscape-picks .pick small { display: block; font-size: 11px; color: var(--ink-soft); line-height: 1; }
    .landscape-picks .pick span { line-height: 1.1; }
    .landscape-picks .pick:has(input:checked) { background: #e7d4a8; box-shadow: inset 0 0 0 2px var(--accent); }
    .landscape-picks .pick:has(input:checked) img { opacity: 1; filter: none; }
    .landscape-picks .pick:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 1px; }
    .big-btn {
      min-height: 46px; padding: 8px 18px;
      border: 1px solid var(--edge); border-radius: 8px;
      background: linear-gradient(#66757f, #4c5a64); color: #f4eedf;
      font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: 0.05em;
    }
    .big-btn.secondary { background: var(--paper-2); color: var(--ink); }

    #rules-overlay { gap: 8px; }
    #rules-overlay.player2, #lobby-overlay.player2 { transform: rotate(180deg); }
    .rules-stage { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .rules-stage img { max-width: calc(100% - 80px); max-height: 100%; object-fit: contain; }
    .rules-arrow {
      width: 36px; height: 60px; flex: 0 0 auto; border: 0; background: transparent;
      font-size: 2rem; color: var(--paper);
    }

    .overlay .muted { color: var(--muted); font-size: 15px; margin: 0; text-align: center; max-width: 320px; }

    .hidden-legacy { display: none !important; }

    /* ---------- Online lobby ---------- */
    #online-lobby-overlay { overflow-y: auto; justify-content: safe center; }
    .online-card { max-width: 420px; }
    #online-name-row { display: flex; gap: 8px; align-items: flex-end; }
    #online-name-row label { flex: 1; }
    .lobby-card input[type="text"] {
      width: 100%; min-height: 40px; padding: 4px 8px;
      border: 1px solid var(--edge); border-radius: 6px;
      background: #f3ecdc; color: var(--ink); font-family: var(--body); font-size: 16px;
    }
    .small-btn {
      min-height: 36px; padding: 4px 12px; border: 1px solid var(--edge); border-radius: 6px;
      background: linear-gradient(#66757f, #4c5a64); color: #f4eedf;
      font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: 0.04em;
    }
    .lobby-card h3 { margin: 0; font-family: var(--display); font-size: 13px; letter-spacing: 0.04em; }
    #online-lobby-msg { display: none; padding: 6px 10px; border-radius: 6px; background: var(--paper-2); color: var(--ink); font-size: 15px; }
    #online-players { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; max-height: 40vh; overflow-y: auto; }
    #online-players li { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-bottom: 1px solid rgba(30, 26, 22, 0.15); min-height: 44px; }
    #online-players li.empty { color: var(--ink-soft); font-style: italic; border: 0; }
    #online-players .pname { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #online-players .pstatus { color: var(--ink-soft); font-size: 14px; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
    .dot.free { background: #3f9b4f; }
    .dot.busy { background: #b9ad99; }
    .challenge-card {
      display: flex; flex-direction: column; gap: 6px; padding: 10px;
      border: 2px solid var(--accent); border-radius: 8px; background: #f3ecdc;
    }
    .challenge-card label, #challenge-dialog label {
      display: flex; flex-direction: column; gap: 3px;
      font-family: var(--display); font-weight: 600; font-size: 12px; letter-spacing: 0.03em;
    }
    #challenge-dialog label.inline { flex-direction: row; align-items: center; gap: 8px; }
    .challenge-details { font-size: 14px; color: var(--ink-soft); }
    .challenge-buttons { display: flex; gap: 8px; }
    .challenge-buttons .big-btn { flex: 1; }
    #challenge-dialog { position: fixed; inset: 0; z-index: 1100; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(20, 18, 16, 0.7); overflow-y: auto; }
    #challenge-dialog .lobby-card { max-width: 360px; }

    .online-bar {
      display: none; align-items: center; gap: 8px; padding: 3px 8px; order: -1;
      font-size: 15px; min-height: 36px;
    }
    .online-bar .text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .online-bar .small-btn { min-height: 30px; padding: 2px 10px; }
    #online-result-overlay .lobby-card { text-align: center; }

    /* ---------- Landscape: board left, docks in a column on the right ---------- */
    @media (min-aspect-ratio: 5/4) {
      #app {
        max-width: none;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(280px, 400px);
        grid-template-rows: auto minmax(0, 1fr);
        grid-template-areas: "board top" "board bottom";
        column-gap: 12px;
        row-gap: 6px;
      }
      #board-area { grid-area: board; max-height: none; }
      #dock-top { grid-area: top; }
      #dock-bottom { grid-area: bottom; }
      /* Duel: each player gets half of the side column; the upper half faces player 2. */
      #app.duel { grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); }
    }
    @media (min-aspect-ratio: 5/4) and (min-width: 1100px) {
      #app { grid-template-columns: minmax(0, 1fr) 400px; max-width: 1400px; }
    }
    /* Large screens: the side column grows with the screen (same layout, scaled). */
    @media (min-aspect-ratio: 5/4) and (min-width: 1250px) and (min-height: 720px) {
      #app { grid-template-columns: minmax(0, 1fr) 540px; max-width: 1700px; }
      .dock { zoom: 1.35; }
    }
    @media (min-aspect-ratio: 5/4) and (min-width: 1600px) and (min-height: 900px) {
      #app { grid-template-columns: minmax(0, 1fr) 600px; max-width: 2000px; }
      .dock { zoom: 1.5; }
    }
    @media (min-width: 700px) and (max-aspect-ratio: 5/4) {
      .hint-text { font-size: 18px; }
      .track button { height: 22px; line-height: 22px; font-size: 13px; }
    }
    @media (prefers-reduced-motion: reduce) { .player-bar { transition: none; } }
  </style>
</head>
<body>
  <div id="app">
    <!-- Online lobby -->
    <div id="online-lobby-overlay" class="overlay">
      <div class="paper lobby-card online-card">
        <h1>Online Lobby</h1>

    <!-- Lobby -->
    <div id="lobby-overlay" class="overlay">
      <div class="paper lobby-card">
        <h1>DiceWar</h1>
        <div class="lobby-inner">
          <p>Choose a game mode, a dice set for each player and any landscapes.</p>
          <div id="lobby-config">

                <select id="game-mode-select">

                </select>

            <div class="lobby-player-config">
              <label><span id="p1-set-title">Player 1 – Dice Set</span>
                <select id="p1-dice-set"></select>

          <img src="img/ui/exile.png" alt=""><span class="count" id="p1-exile-count">0</span>
        </button>
        <div class="tracks">
          <div class="bar-name" id="p1-name"><b>Player 1</b></div>
          <div class="track" id="p1-victory-track"><img src="img/ui/crown.png" alt="Victory points"></div>
          <div class="track" id="p1-trigger-track"><img src="img/ui/claw.png" alt="Trigger points"></div>
        </div>
        <button class="pile" id="p1-reserve" aria-label="Player 1 reserve">
          <img src="img/ui/reserve.png" alt=""><span class="count" id="p1-reserve-count">15</span>
        </button>
      </div>
      <nav class="toolbar" id="toolbar">
        <button id="btn-lobby"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Menu</button>
        <button id="btn-undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>Undo</button>
        <button id="btn-redo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>Redo</button>
        <button id="btn-save"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>Save</button>
        <button id="btn-load"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21V9"/><path d="m7 14 5-5 5 5"/><path d="M5 3h14"/></svg>Load</button>
      </nav>
      <input type="file" id="load-file-input" accept=".json,application/json" style="display: none;">
    </div>

    <!-- Kept for older code paths; not shown -->
    <div class="hidden-legacy">
      <span id="round-text"></span>
      <div id="current-die-box"></div>
      <button id="btn-end-turn"></button>
      <button id="btn-die-plus"></button>
      <button id="btn-die-minus"></button>
